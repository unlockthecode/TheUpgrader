# When false, recipes are ignored: an item costs exactly its base-values
# entry, or fallback-value if it has none. Easier to reason about.
use-recipe-pricing: true

# Price for items with no anchor and no recipe. (must be > 0)
fallback-value: 3.0

# Exact prices that ignore recipes completely (material: price).
# Example:
#   value-overrides:
#     diamond: 500.0
value-overrides: {}

# Per-item multipliers on top of the final price (material: multiplier).
# Example:
#   value-multipliers:
#     netherite_ingot: 2.0
value-multipliers: {}

# Materials that cannot be wagered or targeted, in addition to the
# built-in blacklist of technical and unobtainable items.
# Example:
#   blacklist: [shulker_box, ender_chest]
blacklist: []

# --------------------------------------------------------------------------
# Catalog categories
# --------------------------------------------------------------------------
# Order = tab order in the catalog. A category with a well-known id and no
# `items` list uses the built-in smart classifier. Well-known ids:
#   blocks, minerals, tools, combat, food, farming, redstone, misc
# Give a category an explicit `items` list to control it exactly, or invent
# your own ids for fully custom categories. The id `all` is special: it
# always contains every upgradable item.

categories:
  - id: all
    name: "All Items"
    icon: CHEST
  - id: blocks
    name: "Blocks"
    icon: GRASS_BLOCK
  - id: minerals
    name: "Ores & Ingots"
    icon: GOLD_INGOT
  - id: tools
    name: "Tools & Utility"
    icon: IRON_PICKAXE
  - id: combat
    name: "Weapons & Armor"
    icon: DIAMOND_SWORD
  - id: food
    name: "Food"
    icon: COOKED_BEEF
  - id: farming
    name: "Farming & Nature"
    icon: WHEAT
  - id: redstone
    name: "Redstone & Rails"
    icon: REDSTONE
  - id: misc
    name: "Everything Else"
    icon: PAPER

# Custom category example - uncomment to use:
#   - id: treasures
#     name: "Treasures"
#     icon: NETHER_STAR
#     items: [diamond, emerald, ancient_debris, elytra, totem_of_undying]

# --------------------------------------------------------------------------
# GUI layout
# --------------------------------------------------------------------------
# Chest slots are numbered 0-53, left to right, top to bottom
# (each row is 9 slots: row 0 = 0-8, row 1 = 9-17, ... row 5 = 45-53).

gui:
  # Main upgrader view buttons.
  slots:
    info: 4            # win streak display (left-click only, no book)
    wager: 10          # the wager slot
    arrow: 13          # decoration between wager and target
    target: 16         # the target slot
    stats: 22          # stats GUI shortcut button
    count-minus32: 28  # -32 button
    count-minus16: 29  # -16 button
    count-minus1: 30   # -1 button
    count: 31          # count display (click to reset to 1)
    count-plus1: 32    # +1 button
    count-plus16: 33   # +16 button
    count-plus32: 34   # +32 button
    catalog: 39        # catalog button
    upgrade: 40        # UPGRADE button
    close: 41          # close button

  # Where category tabs appear on the category selection screen.
  # (at most 9; extra categories are not shown)
  category-slots: [12, 13, 14, 21, 22, 23, 30, 31, 32]

  # Catalog view navigation.
  catalog:
    prev: 45           # previous page arrow
    page-indicator: 48 # "page x / y" display
    back: 50           # back to categories
    next: 53           # next page arrow

  # The reel used by the spin animation. The reel plays between the wager and
  # target displays, so do NOT include the wager, target or border slots
  # (9, 10, 16, 17 in the default layout) - that would overwrite them mid-spin.
  # Default: 5 slots centered (11-15)
  spin-slots: [11, 12, 13, 14, 15]

# --------------------------------------------------------------------------
# Quick-pick presets
# --------------------------------------------------------------------------
# The preset buttons shown under the wager/target row. Each preset needs:
#   label  - button text
#   icon   - button material
#   color  - a ChatColor name (YELLOW, GOLD, RED, GREEN, AQUA, ...)
#   slot   - which chest slot the button sits in (0-53)
# and exactly ONE of:
#   multiplier - pick a target worth (wager x multiplier)
#   chance     - pick a target sized for roughly that win chance (0-1)

presets:
  - label: "×2"
    icon: GOLD_NUGGET
    color: YELLOW
    slot: 19
    multiplier: 2.0
  - label: "×4"
    icon: GOLD_INGOT
    color: YELLOW
    slot: 20
    multiplier: 4.0
  - label: "×8"
    icon: GOLD_BLOCK
    color: YELLOW
    slot: 21
    multiplier: 8.0
  - label: "30%"
    icon: RED_DYE
    color: RED
    slot: 23
    chance: 0.30
  - label: "50%"
    icon: ORANGE_DYE
    color: GOLD
    slot: 24
    chance: 0.50
  - label: "70%"
    icon: LIME_DYE
    color: GREEN
    slot: 25
    chance: 0.70

# --------------------------------------------------------------------------
# Statistics GUI layout
# --------------------------------------------------------------------------
# Configure the slots for the statistics GUI (opened via /upgrade stats or the
# stats button in the main upgrader GUI).
stats-gui:
  # Main menu buttons
  player-stats: 19     # Your stats button
  leaderboards: 21     # Leaderboards button
  achievements: 23     # Achievements button
  server-stats: 25     # Server stats button
  back: 45             # Back button (player stats view)
  close: 53            # Close button

  # Content area slots (used for stats display, leaderboard entries, achievements)
  content-slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34, 37, 38, 39, 40, 41, 42, 43]

  # Leaderboard view navigation (bottom row)
  leaderboard-prev: 45
  leaderboard-back: 48
  leaderboard-indicator: 49
  leaderboard-next: 53

  # Achievement view
  achievement-back: 45
  achievement-close: 53

  # Server stats view
  server-stats-back: 45
  server-stats-close: 53
