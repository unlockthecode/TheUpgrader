# ==========================================================================
# TheUpgrader v1.4.0 configuration
#
# Gambling-style item upgrader - risk items for a shot at better ones.
#
# Edit this file, then run /upgrade reload in game (or restart the server).
# Every value is validated on load: invalid entries fall back to their
# default and print a warning to the console, so a typo can never break
# the plugin.
# ==========================================================================

# --------------------------------------------------------------------------
# Gameplay
# --------------------------------------------------------------------------

# Win chance = (wager value / target total value) x house-edge, clamped
# between min-chance and max-chance.
# 1.0 = perfectly fair odds, 0.9 = 10% house edge. (0.01 - 1.0)
house-edge: 0.9

# Lowest possible win chance. (0.0 - 1.0)
min-chance: 0.001

# Highest possible win chance. (0.01 - 1.0)
max-chance: 0.9

# Spin animation length in ticks (20 ticks = 1 second, range 20-600).
# 120 = 6 seconds, the tuned default feel.
spin-ticks: 120

# Maximum number of target items a single upgrade can pay out. (1 - 64)
max-target-count: 64

# Rate limiting: at most `attempt-limit` upgrades per player per
# `attempt-window-seconds`. Set either to 0 to disable.
attempt-limit: 0
attempt-window-seconds: 0

# Multiplies the computed value of every item. (0.01 - 1000)
# Use it to inflate or deflate the whole economy at once.
global-value-multiplier: 1.0

# --------------------------------------------------------------------------
# Item values
# --------------------------------------------------------------------------
# How item prices are built, in order:
#   1. base-values below are the anchor prices the solver starts from
#   2. if use-recipe-pricing is true, every craftable item is then priced
#      from the server's own recipes (custom recipes are priced too)
#   3. value-overrides pin exact prices that ignore recipes entirely
#   4. value-multipliers scale individual items on top of everything else
#      (stacking with global-value-multiplier)
#   5. anything still unpriced costs fallback-value
#
# Raise or lower a base-value to reprice that item and everything the
# recipe solver derives from it.

# Anchor prices for the recipe solver (material name: price).
# Rebalanced to typical Minecraft server economy prices.
base-values:
